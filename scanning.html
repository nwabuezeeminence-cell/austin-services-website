<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Scanning - Austin Services</title><link rel="stylesheet" href="./css/style.css"><link rel="stylesheet" href="./css/service.css"></head><body>
<header><div class="container nav"><div class="brand">AUSTIN SERVICES</div></div></header>
<main class="service-container">
  <div class="service-header"><h1>Scanning Service</h1><p>Scan to PDF, JPG, Email</p></div>
  <div class="service-box">
    <h3>Calculate Your Price</h3>
    <div class="form-group"><label>Number of Pages</label><input type="number" id="pages" value="1" min="1"></div>
    <div class="form-group"><label>Send To</label><select id="delivery"><option value="0">WhatsApp - Free</option><option value="0">Email - Free</option><option value="500">USB Drive - ₦500</option></select></div>
    <div class="quote-box"><p>Estimated Total</p><div class="total-price" id="total">₦100</div></div>
  </div>
  <div class="form-group"><label>Your Name</label><input type="text" id="custName" placeholder="Enter your name"></div>
<div class="form-group"><label>Your Phone</label><input type="tel" id="custPhone" placeholder="080xxxxxxxx"></div>
  <div class="btn-group"><button id="submitBtn" class="btn btn-whatsapp">Send Request to Admin</button><a href="index.html" class="btn btn-back">← Back Home</a></div>
  <p id="successMsg" style="color:green;text-align:center;margin-top:10px;display:none">✓ Request sent! Admin will contact you soon.</p>
</main>
<script>
function calc(){let price=(parseInt(document.getElementById('pages').value)*100)+parseInt(document.getElementById('delivery').value);document.getElementById('total').innerText='₦'+price}
document.querySelectorAll('select, input').forEach(el=>el.oninput=calc);calc();
document.getElementById('submitBtn').onclick=()=>{let reqs=JSON.parse(localStorage.getItem('austinRequests')||'[]');reqs.push({service:'Scanning',time:new Date().toLocaleString(),details:{pages:document.getElementById('pages').value,delivery:document.getElementById('delivery').options[document.getElementById('delivery').selectedIndex].text,total:document.getElementById('total').innerText}});localStorage.setItem('austinRequests',JSON.stringify(reqs));document.getElementById('successMsg').style.display='block';document.getElementById('submitBtn').innerText='Request Sent';document.getElementById('submitBtn').disabled=true;}
</script></body></html>
