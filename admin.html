<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Austin Services</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="./service.css">
</head>
<body>
<header><div class="container nav"><div class="brand">ADMIN PANEL</div><a href="index.html">← Back to Site</a></div></header>

<main class="service-container">
  <!-- LOGIN FORM -->
  <div id="loginBox" class="service-box" style="max-width:400px;margin:60px auto">
    <h2 style="text-align:center">Admin Login</h2>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="adminPass" placeholder="Enter password">
    </div>
    <button onclick="login()" class="btn btn-whatsapp" style="width:100%">Login</button>
    <p id="errorMsg" style="color:red;text-align:center;margin-top:10px;display:none">Wrong password!</p>
  </div>

  <!-- ADMIN DASHBOARD -->
  <div id="dashboard" style="display:none">
    <div class="service-header">
      <h1>Customer Requests</h1>
      <button onclick="logout()" style="background:#666;color:#fff;border:0;padding:8px 16px;border-radius:8px">Logout</button>
      <button onclick="clearAll()" style="background:red;color:#fff;border:0;padding:8px 16px;border-radius:8px;margin-left:8px">Clear All</button>
    </div>
    <div id="requestsList"></div>
  </div>
</main>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
const ADMIN_PASSWORD = "Austin@123456"; // <-- CHANGE THIS TO YOUR PASSWORD

// 1. YOUR FIREBASE CONFIG - paste same config from contact.html
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT",
  storageBucket: "YOUR_PROJECT.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();


function login(){
  let pass = document.getElementById('adminPass').value;
  if(pass === ADMIN_PASSWORD){
    localStorage.setItem('austinAdminLoggedIn', 'true');
    showDashboard();
  } else {
    document.getElementById('errorMsg').style.display = 'block';
  }
}

function logout(){
  localStorage.removeItem('austinAdminLoggedIn');
  location.reload();
}

function showDashboard(){
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadRequests();
}

// 2. LOAD REQUESTS FROM FIREBASE IN REAL TIME
function loadRequests(){
  db.ref("messages").orderByChild("time").on("value", (snapshot) => {
    let list = document.getElementById('requestsList');
    list.innerHTML = '';
    
    if(!snapshot.exists()){ 
      list.innerHTML = '<div class="service-box"><p>No requests yet.</p></div>'; 
      return; 
    }

    // Loop through all messages
    snapshot.forEach((childSnapshot) => {
      const r = childSnapshot.val();
      const id = childSnapshot.key;
      
      list.innerHTML = `
        <div class="service-box">
          <h3>${r.subject}</h3>
          <p><b>Time:</b> ${new Date(r.time).toLocaleString()}</p>
          <p><b>Name:</b> ${r.name}</p>
          <p><b>Phone:</b> ${r.phone}</p>
          <p><b>Message:</b> ${r.message}</p>
          <button onclick="deleteMsg('${id}')" style="background:red;color:#fff;border:0;padding:5px 10px;border-radius:5px">Delete</button>
        </div>
      ` + list.innerHTML; // newest on top
    });
  });
}

function deleteMsg(id){
  if(confirm('Delete this request?')){
    db.ref("messages/" + id).remove();
  }
}

function clearAll(){
  if(confirm('Delete ALL requests?')){
    db.ref("messages").remove();
  }
}

// Check if already logged in
if(localStorage.getItem('austinAdminLoggedIn') === 'true'){
  showDashboard();
}

// Allow Enter key to login
document.getElementById('adminPass').addEventListener('keypress', function(e){
  if(e.key === 'Enter') login();
})
</script></body></html>
