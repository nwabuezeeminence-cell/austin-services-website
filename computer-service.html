<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Computer Service - Austin Services</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./service.css"></head><body>
<header><div class="container nav"><div class="brand">AUSTIN SERVICES</div></div></header>
<main class="service-container">
  <div class="service-header"><h1>Computer Service</h1><p>Repair, Setup + Maintenance</p></div>
  <div class="service-box">
    <h3>Request Service</h3>
    <div class="form-group"><label>Service Needed</label><select id="service"><option value="5000">Windows Installation - ₦5,000</option><option value="3000">Virus Removal - ₦3,000</option><option value="8000">Screen Replacement</option><option value="0">Hardware Upgrade - Quote</option><option value="0">Other - Quote</option></select></div>
    <div class="form-group"><label>Describe Your Problem</label><textarea id="desc" rows="3" style="width:100%;padding:12px;border:1px solid #ddd;border-radius:8px"></textarea></div>
    <div class="quote-box"><p>Estimated Price</p><div class="total-price" id="total">₦5,000</div></div>
  </div>
  <div class="form-group"><label>Your Name</label><input type="text" id="custName" placeholder="Enter your name"></div>
<div class="form-group"><label>Your Phone</label><input type="tel" id="custPhone" placeholder="080xxxxxxxx"></div>
  <div class="btn-group"><button id="submitBtn" class="btn btn-whatsapp">Send Request to Admin</button><a href="index.html" class="btn btn-back">← Back Home</a></div>
  <p id="successMsg" style="color:green;text-align:center;margin-top:10px;display:none">✓ Request sent! Admin will contact you soon.</p>
</main>
<script>
function calc(){let price=document.getElementById('service').value;document.getElementById('total').innerText=price==0?'Call for Quote':'₦'+price}
document.querySelectorAll('select, textarea').forEach(el=>el.oninput=calc);calc();
document.getElementById('submitBtn').onclick=()=>{let reqs=JSON.parse(localStorage.getItem('austinRequests')||'[]');reqs.push({service:'Computer Service',time:new Date().toLocaleString(),details:{service:document.getElementById('service').options[document.getElementById('service').selectedIndex].text,problem:document.getElementById('desc').value,total:document.getElementById('total').innerText}});localStorage.setItem('austinRequests',JSON.stringify(reqs));document.getElementById('successMsg').style.display='block';document.getElementById('submitBtn').innerText='Request Sent';document.getElementById('submitBtn').disabled=true;}
</script></body></html>
