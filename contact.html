<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact - Austin Services</title>
<link rel="stylesheet" href="./style.css">
<link rel="stylesheet" href="./service.css">
</head>
<body>
<header>
  <div class="container nav">
    <div class="brand">AUSTIN SERVICES</div>
    <a href="index.html">← Home</a>
  </div>
</header>

<main class="service-container">
  <div class="service-header">
    <h1>Contact Us</h1>
    <p>Reach out directly</p>
  </div>

  <!-- 1. SEND MESSAGE FORM -->
  <div class="service-box">
    <h3>Send Message Request</h3>
    <form id="contactForm">
      <input type="text" id="name" placeholder="Your Name" required>
      <input type="tel" id="phone" placeholder="Your Phone Number" required>
      <input type="text" id="subject" placeholder="Subject e.g Graphics Design" required>
      <textarea id="message" placeholder="Your Message" rows="4" required></textarea>
      <button type="submit" class="btn">Send to Admin</button>
    </form>
    <p id="status" style="margin-top:10px;"></p>
  </div>

  <!-- 2. OUR INFO -->
  <div class="service-box">
    <h3>Our Info</h3>
    <p><b>Address:</b> No 26 egita road obite town "Onelga" Rivers State NIGERIA</p>
    <p><b>Phone:</b> 07082299106</p>
    <p><b>Hours:</b> Mon - Sat: 8am - 6pm</p>
  </div>

  <!-- 3. WHATSAPP -->
  <div class="service-box" style="text-align:center">
    <h3>Chat with Admin on WhatsApp</h3>
    <p>For urgent questions or complaints</p>
    <a href="https://wa.me/2347025279121" target="_blank" class="btn btn-whatsapp" style="display:inline-block;margin-top:10px">Message on WhatsApp</a>
  </div>
</main>

<!-- FIREBASE SDK -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

<script>
  // 1. YOUR FIREBASE CONFIG - replace with yours
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId: "YOUR_PROJECT",
    storageBucket: "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  // 2. SEND MESSAGE TO FIREBASE
  document.getElementById("contactForm").addEventListener("submit", (e) => {
    e.preventDefault();
    
    const name = document.getElementById("name").value;
    const phone = document.getElementById("phone").value;
    const subject = document.getElementById("subject").value;
    const message = document.getElementById("message").value;
    const status = document.getElementById("status");

    const newMessageRef = db.ref("messages").push();

    newMessageRef.set({
        name: name,
        phone: phone,
        subject: subject,
        message: message,
        time: Date.now(),
        status: "new"
    }).then(() => {
        status.innerText = "Message sent successfully! We will contact you soon.";
        status.style.color = "green";
        document.getElementById("contactForm").reset();
    }).catch((error) => {
        status.innerText = "Error: " + error.message;
        status.style.color = "red";
    });
  });
</script>

</body>
</html>
