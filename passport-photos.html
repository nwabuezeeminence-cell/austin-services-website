<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Passport Photos - Austin Services</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./service.css"></head><body>
<header><div class="container nav"><div class="brand">AUSTIN SERVICES</div></div></header>
<main class="service-container">
  <div class="service-header"><h1>Passport Photographs</h1><p>Instant Studio Photos</p></div>
  <div class="service-box">
    <h3>Select Options</h3>
    <div class="form-group"><label>Package</label><select id="package"><option value="2000">8pcs - ₦2,000</option><option value="3000">12pcs - ₦3,000</option><option value="4000">16pcs - ₦4,000</option></select></div>
    <div class="form-group"><label>Background</label><select id="bg"><option value="White">White</option><option value="Blue">Blue</option></select></div>
    <div class="quote-box"><p>Estimated Total</p><div class="total-price" id="total">₦2,000</div></div>
  </div>
  <div class="form-group"><label>Your Name</label><input type="text" id="custName" placeholder="Enter your name"></div>
<div class="form-group"><label>Your Phone</label><input type="tel" id="custPhone" placeholder="080xxxxxxxx"></div>
  <div class="btn-group"><button id="submitBtn" class="btn btn-whatsapp">Send Request to Admin</button><a href="index.html" class="btn btn-back">← Back Home</a></div>
  <p id="successMsg" style="color:green;text-align:center;margin-top:10px;display:none">✓ Request sent! Admin will contact you soon.</p>
</main>
<script>
function calc(){let price=document.getElementById('package').value;document.getElementById('total').innerText='₦'+price}
document.querySelectorAll('select').forEach(el=>el.oninput=calc);calc();
document.getElementById('submitBtn').onclick=()=>{let reqs=JSON.parse(localStorage.getItem('austinRequests')||'[]');reqs.push({service:'Passport Photos',time:new Date().toLocaleString(),details:{package:document.getElementById('package').options[document.getElementById('package').selectedIndex].text,background:document.getElementById('bg').value,total:document.getElementById('total').innerText}});localStorage.setItem('austinRequests',JSON.stringify(reqs));document.getElementById('successMsg').style.display='block';document.getElementById('submitBtn').innerText='Request Sent';document.getElementById('submitBtn').disabled=true;}
</script></body></html>
